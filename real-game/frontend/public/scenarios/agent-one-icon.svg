  <!-- Antenna -->
  <rect x="47" y="6" width="6" height="14" fill="white"/>
  <circle cx="50" cy="3" r="3" fill="white"/>

  <!-- Left eye -->
  <circle cx="36" cy="28" r="3.5" fill="#10b981"/>

  <!-- Right eye -->
