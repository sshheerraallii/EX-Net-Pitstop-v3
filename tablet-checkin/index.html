<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Extreme Agent One — Check-In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="checkin-screen">
      <div class="checkin-card">
        <img src="extreme-logo.png" alt="Extreme Networks" class="checkin-logo" />

        <div class="checkin-header">
          <h1>
            <img src="agent-one-logo.svg" alt="" class="checkin-header-mark" />
            <span>Agent Check-In</span>
          </h1>
          <p>Enter the player's details and check them in — the game starts on the kiosk after a short countdown.</p>
        </div>

        <form id="checkinForm" class="checkin-form" autocomplete="off">
          <div class="form-group">
            <label for="name">Name *</label>
            <input id="name" name="name" type="text" placeholder="Player's name" autofocus />
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="">Select a country (optional)</option>
            </select>
          </div>

          <div id="formMessage" class="form-message" hidden></div>

          <button type="submit" id="submitBtn" class="submit-btn">
            <span id="submitLabel">Check In</span>
          </button>
        </form>

        <div id="countdownPanel" class="countdown-panel" hidden>
          <div class="countdown-label">Checked in</div>
          <div class="countdown-name" id="countdownName"></div>
          <div class="countdown-num" id="countdownNum">20</div>
          <div class="countdown-hint">Head to the kiosk — the game is starting.</div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
